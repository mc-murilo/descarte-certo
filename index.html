<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Descarte Certo - Fortaleza</title>
  <meta name="description" content="Veja como e onde descartar pilhas, óleo, eletrônicos e outros materiais em Fortaleza.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo">
    <div class="miolo">
      <h1>Descarte Certo</h1>
      <p>Diga o que você quer descartar e veja como fazer e onde levar em Fortaleza.</p>
      <label class="busca">
        <span class="sr">Buscar material</span>
        <input id="busca" type="search" placeholder="Ex.: pilha, óleo, celular, geladeira" autocomplete="off">
      </label>
    </div>
  </header>

  <main class="miolo">
    <section aria-labelledby="t-materiais">
      <h2 id="t-materiais">Materiais</h2>
      <p id="status" class="status" aria-live="polite"></p>
      <ul id="lista-materiais" class="materiais"></ul>
    </section>

    <section id="detalhe" class="detalhe" tabindex="-1" hidden></section>
  </main>

  <footer class="rodape">
    <div class="miolo">
      <p>Confirme com o local o que é aceito e o horário antes de ir.</p>
      <p>Dados atualizados em <span id="atualizacao"></span>.</p>
    </div>
  </footer>

  <!-- Ordem importa: dados primeiro, lógica por último -->
  <script src="js/materiais.js"></script>
  <script src="js/pontos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
